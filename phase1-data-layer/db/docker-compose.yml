name: nemoclaw-platform

services:
  postgres:
    image: pgvector/pgvector:pg16   # Postgres 16 + pgvector (drop-in; data volume unchanged)
    container_name: nemoclaw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: enterprise_intel
      POSTGRES_USER: vaultstack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultstack -d enterprise_intel"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: nemoclaw-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vaultstack
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-change-me-dev-only}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # one-shot: creates the raw-documents bucket, then exits
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 vaultstack $${MINIO_PASSWORD:-change-me-dev-only} &&
      mc mb --ignore-existing local/raw-documents &&
      echo 'bucket raw-documents ready'
      "
    environment:
      MINIO_PASSWORD: ${MINIO_PASSWORD:-change-me-dev-only}

  # open-source metasearch (Google/Bing/DDG aggregator) — replaces Tavily. No API key.
  searxng:
    image: searxng/searxng:latest
    container_name: nemoclaw-searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
    volumes:
      - ./searxng:/etc/searxng:rw
    ports:
      - "127.0.0.1:8081:8080"

  # read-only REST window onto the facts DB, for the pe-intake agent
  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: nemoclaw-postgrest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://agent_ro:${AGENT_RO_PASSWORD:-change-me-dev-only}@postgres:5432/enterprise_intel
      PGRST_DB_ANON_ROLE: agent_ro
      PGRST_DB_SCHEMAS: public
    ports:
      - "3005:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # collection + extraction runner (started on demand, not with `up`)
  worker:
    build: ../../phase2-workers
    profiles: ["workers"]
    environment:
      PGHOST: postgres
      PGDATABASE: enterprise_intel
      PGUSER: vaultstack
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: vaultstack
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-change-me-dev-only}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_API_KEY1: ${NVIDIA_API_KEY1:-}
      NVIDIA_API_KEY2: ${NVIDIA_API_KEY2:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # news collector (phase 3) — searches business press via Tavily, on demand
  news-worker:
    build: ../../phase3-news-worker
    profiles: ["workers"]
    environment:
      PGHOST: postgres
      PGDATABASE: enterprise_intel
      PGUSER: vaultstack
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: vaultstack
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-change-me-dev-only}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # analysis agents (phase 6) — schema discovery etc. Run on demand.
  analysis:
    build:
      context: ../..
      dockerfile: phase6-analysis/Dockerfile
    profiles: ["workers"]
    environment:
      PGHOST: postgres
      PGDATABASE: enterprise_intel
      PGUSER: vaultstack
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: vaultstack
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-change-me-dev-only}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_API_KEY1: ${NVIDIA_API_KEY1:-}
      NVIDIA_API_KEY2: ${NVIDIA_API_KEY2:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # analyst web dashboard (trusted code; direct DB access; localhost only)
  dashboard:
    build: ../../phase4-analyst-surface/dashboard
    container_name: nemoclaw-dashboard
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: enterprise_intel
      PGUSER: vaultstack
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_API_KEY1: ${NVIDIA_API_KEY1:-}
      NVIDIA_API_KEY2: ${NVIDIA_API_KEY2:-}
      NVIDIA_EMBED_MODEL: ${NVIDIA_EMBED_MODEL:-nvidia/nv-embedqa-e5-v5}
    ports:
      - "127.0.0.1:8090:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # 24/7 heartbeat: re-crawl, news sweep, transcript intake, extraction — every cycle
  scheduler:
    build:
      context: ../..
      dockerfile: phase3-scheduler/Dockerfile
    container_name: nemoclaw-scheduler
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: enterprise_intel
      PGUSER: vaultstack
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: vaultstack
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-change-me-dev-only}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_API_KEY1: ${NVIDIA_API_KEY1:-}
      NVIDIA_API_KEY2: ${NVIDIA_API_KEY2:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      NVIDIA_EMBED_MODEL: ${NVIDIA_EMBED_MODEL:-nvidia/nv-embedqa-e5-v5}
      INTERVAL_HOURS: ${INTERVAL_HOURS:-24}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
