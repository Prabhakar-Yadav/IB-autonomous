<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PE Intelligence{% endblock %}</title>
<style>
  :root {
    --paper:#fbfaf7; --panel:#ffffff; --rule:#111319; --hair:#dcdad2; --hair2:#eceae3;
    --ink:#111319; --ink-2:#43485a; --ink-3:#8a8d99;
    --navy:#12306b; --navy-bright:#1c4dbb; --red:#b3222d; --green:#1e6b45; --amber:#95640a;
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--paper); color:var(--ink);
         font:15px/1.55 "Segoe UI", system-ui, sans-serif; }
  a { color:var(--navy-bright); text-decoration:none; }
  a:hover { text-decoration:underline; text-underline-offset:3px; }

  /* masthead */
  nav { display:flex; align-items:baseline; gap:2rem; padding:1rem 2rem .8rem;
        background:var(--paper); border-bottom:3px double var(--rule); }
  nav .brand { font-family:Georgia, "Times New Roman", serif; font-size:1.45rem;
               font-weight:700; letter-spacing:-.015em; color:var(--ink); }
  nav .brand em { font-style:normal; color:var(--red); }
  nav .tabs { display:flex; gap:1.4rem; margin-left:auto; }
  nav a.tab { color:var(--ink-2); font-size:.78rem; font-weight:700;
              text-transform:uppercase; letter-spacing:.14em; }
  nav a.tab:hover { color:var(--red); text-decoration:none; }

  main { max-width:1180px; margin:2rem auto 4rem; padding:0 2rem; }
  h1 { font-family:Georgia, serif; font-size:1.9rem; font-weight:700;
       letter-spacing:-.02em; margin-bottom:.3rem; }
  .sub { color:var(--ink-3); margin-bottom:1.6rem; font-size:.92rem; }
  h2 { font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:.16em;
       color:var(--ink); margin:2.2rem 0 .55rem; padding-top:.55rem;
       border-top:2px solid var(--rule); }

  .panel { background:var(--panel); border:1px solid var(--hair); padding:0; margin-bottom:1.2rem; }
  .panel.pad { padding:1rem 1.2rem; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th { text-align:left; color:var(--ink-3); font-weight:700; font-size:.7rem;
       text-transform:uppercase; letter-spacing:.12em;
       padding:.6rem .8rem .4rem; border-bottom:1px solid var(--rule); }
  td { padding:.55rem .8rem; border-bottom:1px solid var(--hair2); vertical-align:top; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:#f4f6fb; }

  .bar { background:var(--hair2); height:7px; width:150px; }
  .bar > div { background:var(--navy); height:100%; }

  /* typographic status markers — no pills */
  .badge { font-size:.72rem; font-weight:700; text-transform:uppercase;
           letter-spacing:.08em; white-space:nowrap; }
  .badge::before { content:"▪ "; font-size:.9em; }
  .badge.verified   { color:var(--green); }
  .badge.conflicted { color:var(--amber); }
  .badge.unverified { color:var(--ink-3); }
  .badge.rejected   { color:var(--red); }
  .badge.founder    { color:var(--navy-bright); }
  .badge.founder::before { content:"§ "; }

  .dim { color:var(--ink-3); } .num { font-variant-numeric:tabular-nums; }
  .src { font-size:.78rem; color:var(--ink-3); word-break:break-all; }
  .src a { color:var(--ink-3); text-decoration:underline; text-decoration-color:var(--hair); }
  .src a:hover { color:var(--navy-bright); }

  button { border:1px solid var(--rule); padding:.4rem 1.1rem; cursor:pointer;
           font:inherit; font-size:.74rem; font-weight:700; text-transform:uppercase;
           letter-spacing:.1em; background:var(--panel); color:var(--ink); }
  button.keep { background:var(--rule); color:#fff; }
  button.keep:hover { background:var(--green); border-color:var(--green); }
  button.reject { border-color:var(--red); color:var(--red); background:#fff; }
  button.reject:hover { background:var(--red); color:#fff; }

  .statrow { display:flex; flex-wrap:wrap; margin:0 0 1.8rem; border:1px solid var(--hair);
             border-top:2px solid var(--rule); background:var(--panel); }
  .stat { flex:1; min-width:150px; padding:.9rem 1.2rem .8rem;
          border-right:1px solid var(--hair); }
  .stat:last-child { border-right:none; }
  .stat .v { font-family:Georgia, serif; font-size:2rem; font-weight:700;
             letter-spacing:-.02em; line-height:1.1; }
  .stat .l { color:var(--ink-3); font-size:.7rem; font-weight:700;
             text-transform:uppercase; letter-spacing:.12em; margin-top:.15rem; }
  .stat.good .v { color:var(--green); } .stat.warn .v { color:var(--amber); }
  .stat.crit .v { color:var(--red); }
  .overflow { overflow-x:auto; }
</style>
</head>
<body>
<nav>
  <span class="brand">PE<em>·</em>Intelligence</span>
  <div class="tabs">
    <a class="tab" href="/">Companies</a>
    <a class="tab" href="/how">How it works</a>
    <a class="tab" href="/search">Search</a>
    <a class="tab" href="/discoveries">Discoveries</a>
    <a class="tab" href="/conflicts">Conflict Queue</a>
    <a class="tab" href="/pipeline">Pipeline</a>
  </div>
</nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
